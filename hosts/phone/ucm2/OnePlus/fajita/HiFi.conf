# Speaker route from the SDM845 UCM fajita profile:
# https://gitlab.com/sdm845-mainline/alsa-ucm-conf/-/blob/9ed12836b269764c4a853411d38ccb6abb70b383/ucm2/OnePlus/fajita/HiFi.conf
# MultiMedia3 (PCM 2) feeds QUAT_MI2S_RX and the TFA9894 amplifier.
# The firmware's default MUSIC_48000 profile supplies the amplifier settings;
# PipeWire supplies software volume. Do not use enchilada's Amp DSP Switch.
SectionVerb {
    EnableSequence [
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia3' 1"
    ]
    DisableSequence [
        cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia3' 0"
    ]
    Value { TQ "HiFi" }
}
SectionDevice."Speaker" {
    Comment "Phone Speaker"
    Value {
        PlaybackPriority 200
        PlaybackPCM "hw:${CardId},2"
        PlaybackChannels 2
    }
}
