# Neofetch layout with the built-in NixOS logo.
print_info() {
    info title
    info underline
    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Terminal" term
    info "CPU" cpu
    info "Memory" memory
    # BLIX_BATTERY_INFO
    print_blue_palette
}

image_backend="ascii"
ascii_distro="NixOS"
ascii_colors=(distro)
colors=(6 7 7 6 7 7)
bold="on"
underline_enabled="on"
separator=":"
color_blocks="on"
block_range=(0 15)
block_width=3
block_height=1
gap=3
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="off"
shell_path="off"
shell_version="on"
memory_percent="off"
memory_unit="mib"
cpu_brand="on"
cpu_temp="off"
cpu_cores="logical"
cpu_speed="on"
cpu_shorthand="off"

# Keep the palette layout while replacing its two magenta swatches with
# ANSI cyan, matching the headings.
print_blue_palette() {
    local palette
    palette="$(get_cols)"
    palette="${palette//$'\e[35m'/$'\e[36m'}"
    palette="${palette//$'\e[45m'/$'\e[46m'}"
    palette="${palette//$'\e[38;5;13m'/$'\e[36m'}"
    palette="${palette//$'\e[48;5;13m'/$'\e[46m'}"
    printf '%s\n' "$palette"
    ((info_height += block_range[1]>7 ? block_height+2 : block_height+1))
}
