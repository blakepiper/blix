# Minimal compositor profile for global window transparency.
# Keep rendering on X11's XRender path and disable visual effects.
backend = "xrender";
vsync = false;
use-damage = true;

shadow = false;
fading = false;
blur-background = false;
corner-radius = 0;

# Rules are ordered; later matching rules override earlier values.
rules = (
  {
    opacity = 0.80;
    opacity-override = true;
  },
  {
    match = "focused";
    opacity = 0.85;
    opacity-override = true;
  },
  {
    # YouTube's title is included in Firefox's active window title. Keep
    # matching Firefox windows opaque while a YouTube tab is active.
    match = "class_g = 'firefox' && name *= 'YouTube'";
    opacity = 1.0;
    opacity-override = true;
  }
);
