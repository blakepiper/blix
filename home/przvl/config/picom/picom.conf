# Minimal compositor profile for global window transparency.
# Synchronize XRender presentation to the display to prevent tearing.
backend = "xrender";
vsync = true;
use-damage = true;

shadow = false;
fading = false;
blur-background = false;
corner-radius = 0;

# Rules are ordered; later matching rules override earlier values.
rules = (
  {
    opacity = 0.80;
    opacity-override = true;
  },
  {
    match = "focused";
    opacity = 0.85;
    opacity-override = true;
  },
  {
    # The local Firefox extension marks only windows whose active tab plays
    # a video. Pausing or switching tabs restores the usual transparency.
    match = "class_g = 'firefox' && name ^= '[blix-video] '";
    opacity = 1.0;
    opacity-override = true;
  }
);
